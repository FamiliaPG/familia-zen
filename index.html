<style>
/* ============ FAMILIA ZEN — tokens ============ */
:root{
  --ground:#EFF1EA; --surface:#FBFCF8; --surface2:#F4F6EF; --sunken:#E6E9DF;
  --ink:#26332C; --ink2:#5C6A61; --ink3:#8B978D; --line:#DEE3D6; --line2:#CBD2C2;
  --verde:#33684B; --verde-ink:#2A5740; --matcha:#6E9C6B; --verde-soft:#E2ECE0; --verde-wash:#EAF1E7;
  --kin:#A87E1C; --kin-bright:#D9A62E; --kin-soft:#F5EBD2; --kin-wash:#FAF4E3;
  --night:#5A6BA8; --clay:#A65440; --warn:#B07926; --btn-ink:#fff;
  --shadow:0 1px 2px rgba(38,51,44,.06),0 6px 24px -8px rgba(38,51,44,.12);
  --shadow-lg:0 4px 12px rgba(38,51,44,.08),0 24px 60px -16px rgba(38,51,44,.22);
  --r:18px; --r-sm:12px; --r-lg:26px;
  --font-d:"Zen Maru Gothic","Hiragino Maru Gothic ProN",ui-rounded,system-ui,sans-serif;
  --font-b:"Karla",ui-sans-serif,system-ui,-apple-system,sans-serif;
}
:root:not([data-theme="light"]){ }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#141A16; --surface:#1C231E; --surface2:#212923; --sunken:#10150F;
    --ink:#E8EDE5; --ink2:#A3B0A4; --ink3:#71806F; --line:#2C362D; --line2:#3A463A;
    --verde:#7FB98F; --verde-ink:#9CCBA8; --matcha:#7FAF7C; --verde-soft:#24352A; --verde-wash:#1F2C23;
    --kin:#D9A62E; --kin-bright:#E8BF57; --kin-soft:#3A3113; --kin-wash:#2C2712;
    --night:#8B99CF; --clay:#C97A63; --warn:#CE9B45; --btn-ink:#10241A;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px -8px rgba(0,0,0,.5);
    --shadow-lg:0 4px 12px rgba(0,0,0,.35),0 24px 60px -16px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --ground:#141A16; --surface:#1C231E; --surface2:#212923; --sunken:#10150F;
  --ink:#E8EDE5; --ink2:#A3B0A4; --ink3:#71806F; --line:#2C362D; --line2:#3A463A;
  --verde:#7FB98F; --verde-ink:#9CCBA8; --matcha:#7FAF7C; --verde-soft:#24352A; --verde-wash:#1F2C23;
  --kin:#D9A62E; --kin-bright:#E8BF57; --kin-soft:#3A3113; --kin-wash:#2C2712;
  --night:#8B99CF; --clay:#C97A63; --warn:#CE9B45; --btn-ink:#10241A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px -8px rgba(0,0,0,.5);
  --shadow-lg:0 4px 12px rgba(0,0,0,.35),0 24px 60px -16px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--font-b);font-size:15.5px;line-height:1.5;min-height:100dvh;overscroll-behavior-y:none}
h1,h2,h3,h4{font-family:var(--font-d);font-weight:700;line-height:1.25;margin:0;text-wrap:balance}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line2);border-radius:var(--r-sm);padding:10px 12px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--verde);box-shadow:0 0 0 3px color-mix(in srgb,var(--verde) 18%,transparent)}
:focus-visible{outline:2.5px solid var(--verde);outline-offset:2px}
::placeholder{color:var(--ink3)}
.num{font-variant-numeric:tabular-nums}
.dnum{font-family:var(--font-d);font-variant-numeric:tabular-nums}
.eyebrow{font-size:.68rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
.muted{color:var(--ink2)} .tiny{font-size:.78rem} .small{font-size:.86rem}
.gold{color:var(--kin)} .greenk{color:var(--verde)}

/* shell */
#shell{max-width:660px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
#topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px;padding:10px 16px calc(10px);padding-top:calc(10px + env(safe-area-inset-top));background:color-mix(in srgb,var(--ground) 86%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
#topbar .brand{font-family:var(--font-d);font-weight:900;font-size:1.05rem;letter-spacing:.01em;display:flex;align-items:center;gap:7px}
#topbar .brand .enso{width:22px;height:22px}
[data-logo]{object-fit:contain}
:root[data-theme="dark"] [data-logo]{filter:brightness(1.55)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) [data-logo]{filter:brightness(1.55)}}
#main{flex:1;padding:16px 16px 96px}
#tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:center;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
#tabbar .wrap{display:flex;width:100%;max-width:660px}
#tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 2px 7px;font-size:.64rem;font-weight:700;letter-spacing:.04em;color:var(--ink3)}
#tabbar button svg{width:23px;height:23px}
#tabbar button.on{color:var(--verde)}
#tabbar button.on .tabdot{width:4px;height:4px;border-radius:99px;background:var(--verde)}
.tabdot{width:4px;height:4px;border-radius:99px;background:transparent}

/* cards & bits */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.card+.card,.vgap>*+*{margin-top:12px}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);white-space:nowrap}
.chip.cat{border:none;color:#fff}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;font-weight:700;padding:5px 11px;border-radius:99px;background:var(--verde-soft);color:var(--verde-ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font-weight:700;border-radius:14px;padding:11px 18px;background:var(--verde);color:var(--btn-ink);transition:transform .1s,filter .15s;text-align:center}
.btn:active{transform:scale(.97)}
.btn.sec{background:var(--surface2);color:var(--ink);border:1.5px solid var(--line2)}
.btn.ghost{background:transparent;color:var(--verde);border:1.5px solid color-mix(in srgb,var(--verde) 40%,transparent)}
.btn.gold{background:linear-gradient(135deg,var(--kin-bright),var(--kin));color:#2A2107}
.btn.small{padding:7px 13px;font-size:.85rem;border-radius:11px}
.btn.big{width:100%;padding:14px;font-size:1.02rem}
.btn:disabled{opacity:.45;cursor:default}
.avatar{display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--surface2);border:2px solid var(--line);flex:none;user-select:none}
label.field{display:block;margin-top:12px}
label.field .lab{display:block;font-size:.8rem;font-weight:700;color:var(--ink2);margin-bottom:5px}
.hr{height:1px;background:var(--line);margin:14px 0;border:none}
.bar{height:8px;border-radius:99px;background:var(--sunken);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--verde);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.bar.gold>i{background:linear-gradient(90deg,var(--kin-bright),var(--kin))}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2>*{min-width:0}
input[type=date]{min-width:0;max-width:100%}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.scroll-x{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.scroll-x::-webkit-scrollbar{display:none}

/* activity cards */
.actcard{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;box-shadow:var(--shadow)}
.actcard .catdot{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.25rem;flex:none}
.actcard.done{opacity:.62}
.actcard.done .t{text-decoration:line-through}
.checkbtn{width:46px;height:46px;border-radius:50%;border:2.5px solid var(--line2);display:flex;align-items:center;justify-content:center;flex:none;transition:all .15s;color:transparent}
.checkbtn:active{transform:scale(.9)}
.checkbtn.on{background:var(--verde);border-color:var(--verde);color:#fff}
.tierchip{font-size:.68rem;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--kin-wash);color:var(--kin);border:1px solid color-mix(in srgb,var(--kin) 30%,transparent)}
.fml{display:inline;background:transparent;border:none;border-bottom:2px dashed color-mix(in srgb,var(--verde) 55%,transparent);border-radius:0;padding:1px 4px;color:var(--verde-ink);white-space:pre-wrap;overflow-wrap:anywhere;outline:none;cursor:text;caret-color:var(--verde);-webkit-user-modify:read-write-plaintext-only;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.fml:focus{border-bottom:2px solid var(--verde);box-shadow:none}
.fml:empty{display:inline-block;position:relative;min-width:var(--phw,10ch);text-align:center;white-space:nowrap;line-height:1.35}
.fml:empty::after{content:"\200B"}
.fml:empty::before{content:attr(data-ph);position:absolute;left:0;right:0;top:0;color:var(--ink3);opacity:.85;pointer-events:none;white-space:nowrap}
.qhelp{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;border:1.5px solid var(--ink3);color:var(--ink2);font-size:.6rem;font-weight:700;vertical-align:text-top;margin-left:2px;padding:0;line-height:1}
.plusdot{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--verde);color:var(--btn-ink);font-weight:900;font-size:.85rem;line-height:1;margin-left:4px;vertical-align:middle;position:relative;top:-1px;box-shadow:0 1px 2px #0002}
h3 .qhelp{vertical-align:middle;position:relative;top:-1px;margin-left:4px}
.cardbtn{display:block;width:100%;font:inherit;text-align:left;color:inherit;cursor:pointer}
.cardbtn:hover{border-color:var(--verde)}
/* postales */
.postal-prev{margin-top:12px;display:flex;flex-direction:column;align-items:center}
.postal-prev img{width:62%;max-width:300px;aspect-ratio:4/5;border-radius:14px;box-shadow:var(--shadow-lg);display:block;background:#EFF1EA}
.postal-prev #ps-status{padding:14px;text-align:center}
.pchip{cursor:pointer;white-space:normal;text-align:left;line-height:1.25}
.pchip.on{background:var(--verde-soft);border-color:var(--verde);color:var(--verde-ink)}
.sheet-actions{position:sticky;bottom:calc(-20px - env(safe-area-inset-bottom));background:var(--surface);padding:12px 0 calc(10px + env(safe-area-inset-bottom));margin-top:14px;border-top:1px solid var(--line)}
.avgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px;margin-top:6px}
.avopt{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 2px;border-radius:12px;border:2px solid transparent;background:var(--surface2);cursor:pointer}
.avopt svg{border-radius:50%;background:var(--surface)}
.avopt.on{border-color:var(--verde);background:var(--verde-soft)}
.avopt .tiny{line-height:1.1;text-align:center}
.avsw{width:34px;height:34px;border-radius:50%;border:3px solid transparent;box-shadow:inset 0 0 0 1px #0002}
.avsw.on{border-color:var(--ink)}
.avatar svg{display:block}
.g-char .head svg{display:block}
.postal-mini{cursor:pointer}
.postal-mini img{width:96px;aspect-ratio:4/5;border-radius:8px;box-shadow:var(--shadow);display:block;background:#EFF1EA}
.stage-postal{display:flex;flex-direction:column;align-items:center}
.stage-postal img{width:min(44vh,330px);aspect-ratio:4/5;border-radius:14px;box-shadow:var(--shadow-lg);display:block;background:#EFF1EA}

/* modal */
#modal-root:empty{display:none}
.mback{position:fixed;inset:0;z-index:120;background:color-mix(in srgb,var(--ink) 40%,transparent);display:flex;align-items:flex-end;justify-content:center;animation:fade .18s}
@media(min-width:560px){.mback{align-items:center}}
.msheet{background:var(--surface);border-radius:var(--r-lg) var(--r-lg) 0 0;width:100%;max-width:560px;max-height:92dvh;overflow-y:auto;padding:20px 20px calc(20px + env(safe-area-inset-bottom));box-shadow:var(--shadow-lg);animation:up .24s cubic-bezier(.2,.8,.2,1)}
@media(min-width:560px){.msheet{border-radius:var(--r-lg)}}
.msheet .handle{width:38px;height:4px;border-radius:99px;background:var(--line2);margin:0 auto 14px}
@keyframes fade{from{opacity:0}} @keyframes up{from{transform:translateY(40px);opacity:.4}}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes flyup{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-70px);opacity:0}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}

/* toast */
#toast-root{position:fixed;left:0;right:0;bottom:calc(76px + env(safe-area-inset-bottom));z-index:130;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{background:var(--ink);color:var(--ground);font-weight:600;font-size:.88rem;padding:10px 18px;border-radius:99px;box-shadow:var(--shadow-lg);animation:up .25s;max-width:88vw}

/* login */
.login-wrap{min-height:calc(100dvh - 40px);display:flex;flex-direction:column;justify-content:center;padding:24px;max-width:480px;margin:0 auto}
.profile-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:12px}
.profile-tile{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px;border-radius:var(--r);background:var(--surface);border:1.5px solid var(--line);transition:transform .12s}
.profile-tile:active{transform:scale(.95)}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:260px;margin:16px auto 0}
.pinpad button{height:58px;border-radius:16px;background:var(--surface2);border:1px solid var(--line);font-family:var(--font-d);font-size:1.3rem;font-weight:700}
.pinpad button:active{background:var(--verde-soft)}
.pindots{display:flex;gap:12px;justify-content:center;margin-top:14px}
.pindots i{width:13px;height:13px;border-radius:50%;background:var(--sunken);border:1.5px solid var(--line2)}
.pindots i.on{background:var(--verde);border-color:var(--verde)}
.emoji-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.emoji-grid button{font-size:1.5rem;padding:8px 0;border-radius:12px;border:2px solid transparent}
.emoji-grid button.on{border-color:var(--verde);background:var(--verde-soft)}
.color-row{display:flex;gap:8px;flex-wrap:wrap}
.color-row button{width:34px;height:34px;border-radius:50%;border:3px solid transparent}
.color-row button.on{border-color:var(--ink)}

/* liga */
.podium{display:flex;align-items:flex-end;gap:8px;justify-content:center;padding:10px 0 0}
.podium .col{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;max-width:110px}
.podium .block{width:100%;border-radius:12px 12px 0 0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:8px;font-family:var(--font-d);font-weight:900}
.lb-row{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:14px}
.lb-row.me{background:var(--verde-wash);border:1px solid color-mix(in srgb,var(--verde) 25%,transparent)}
.lb-rank{width:26px;text-align:center;font-family:var(--font-d);font-weight:700;color:var(--ink3)}
.delta.up{color:var(--verde);font-weight:700} .delta.dn{color:var(--ink3);font-weight:600}
.crown-strip{display:flex;gap:8px;overflow-x:auto;padding:2px}
.crown-card{flex:none;width:104px;border-radius:14px;border:1px solid var(--line);background:var(--surface2);padding:10px;text-align:center}

/* tier medallion */
.medallion{display:inline-flex;align-items:center;gap:7px;padding:5px 12px 5px 7px;border-radius:99px;font-weight:700;font-size:.82rem;border:1.5px solid}

/* calendar */
.monthgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.mday{min-height:50px;border-radius:11px;padding:4px 2px 3px;border:1.5px solid transparent;background:var(--surface);display:flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--font-d)}
.mday .dnum2{font-size:.78rem;font-weight:700}
.mday.out{opacity:.35}
.mday.today:not(.sel){border-color:var(--verde)}
.mday.sel{background:var(--verde)}
.mday.sel .dnum2{color:#fff}
.mday .dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;min-height:5px}
.mday .dots i{width:5px;height:5px;border-radius:99px}
.viewtoggle{display:flex;background:var(--surface2);border:1px solid var(--line);border-radius:99px;padding:3px;gap:2px;flex:none}
.viewtoggle button{padding:4px 12px;border-radius:99px;font-size:.78rem;font-weight:700;color:var(--ink3)}
.viewtoggle button.on{background:var(--verde);color:#fff}
.weekhead{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:10px}
.wday{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;border-radius:13px;border:1.5px solid transparent;font-family:var(--font-d)}
.wday .dn2{font-size:.62rem;font-weight:700;letter-spacing:.06em;color:var(--ink3);text-transform:uppercase}
.wday .dd{font-size:1.02rem;font-weight:700}
.wday.sel{background:var(--verde);border-color:var(--verde)}
.wday.sel .dd,.wday.sel .dn2{color:#fff}
.wday.today:not(.sel){border-color:var(--verde)}
.wday .dots{display:flex;gap:2px;height:4px}
.wday .dots i{width:4px;height:4px;border-radius:99px}

/* presenter (Reunión) */
/* capas: topbar/tabbar 40 < presenter 100 < modal 120 < toast 130 < confeti 200 */
#presenter{position:fixed;inset:0;z-index:100;background:var(--ground);display:flex;flex-direction:column;overflow:hidden}
#presenter .stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:5vh 6vw;text-align:center;overflow-y:auto}
#presenter .stage>*{animation:pop .5s cubic-bezier(.2,.8,.2,1)}
#presenter .pnav{display:flex;align-items:center;justify-content:space-between;padding:14px 18px calc(14px + env(safe-area-inset-bottom))}
#presenter .acts{display:flex;gap:5px}
#presenter .acts i{width:16px;height:5px;border-radius:99px;background:var(--sunken)}
#presenter .acts i.on{background:var(--kin-bright)}
.ptitle{font-size:clamp(1.6rem,4.5vw,3rem);font-weight:900;font-family:var(--font-d)}
.pbig{font-size:clamp(3rem,10vw,7rem);font-weight:900;font-family:var(--font-d);line-height:1}
.muro{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:820px}
.muro i{width:26px;height:26px;border-radius:8px;animation:pop .4s both}
.wall-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}

/* jardín zen */
#garden-scene{position:relative;width:100%;aspect-ratio:5/4;max-height:680px;border-radius:var(--r-lg);overflow:hidden;background:linear-gradient(180deg,var(--g-sky1) 0%,var(--g-sky2) 40%,var(--g-ground) 40.2%,var(--g-ground2) 100%);box-shadow:var(--shadow-lg);user-select:none;touch-action:manipulation}
#garden-scene svg.scenery{position:absolute;inset:0;width:100%;height:100%}
#garden-scene .vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 42%,transparent 55%,#00000026 100%)}
.g-sun{position:absolute;width:13%;aspect-ratio:1;left:7%;top:5%;border-radius:50%;background:radial-gradient(circle at 40% 38%,#fff8 0 18%,transparent 60%),var(--g-sun);box-shadow:0 0 60px 22px var(--g-sunglow);animation:sunpulse 7s ease-in-out infinite;z-index:1}
.g-sun::after{content:"";position:absolute;inset:-42%;border-radius:50%;background:conic-gradient(from 0deg,var(--g-sunray) 0 4deg,transparent 4deg 30deg,var(--g-sunray) 30deg 34deg,transparent 34deg 60deg,var(--g-sunray) 60deg 64deg,transparent 64deg 90deg,var(--g-sunray) 90deg 94deg,transparent 94deg 120deg,var(--g-sunray) 120deg 124deg,transparent 124deg 150deg,var(--g-sunray) 150deg 154deg,transparent 154deg 180deg,var(--g-sunray) 180deg 184deg,transparent 184deg 210deg,var(--g-sunray) 210deg 214deg,transparent 214deg 240deg,var(--g-sunray) 240deg 244deg,transparent 244deg 270deg,var(--g-sunray) 270deg 274deg,transparent 274deg 300deg,var(--g-sunray) 300deg 304deg,transparent 304deg 330deg,var(--g-sunray) 330deg 334deg,transparent 334deg 360deg);animation:sunspin 60s linear infinite;opacity:.45}
@keyframes sunspin{to{transform:rotate(360deg)}}
@keyframes sunpulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.1)}}
.g-cloud{position:absolute;height:6%;aspect-ratio:3/1;background:var(--g-cloud);border-radius:99px;filter:blur(1px);opacity:.92;animation:clouddrift linear infinite;z-index:1}
.g-cloud::before,.g-cloud::after{content:"";position:absolute;background:inherit;border-radius:50%}
.g-cloud::before{width:45%;height:160%;left:14%;top:-70%}
.g-cloud::after{width:34%;height:120%;right:16%;top:-42%}
@keyframes clouddrift{from{transform:translateX(-30vw)}to{transform:translateX(110vw)}}
.g-star{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;animation:twinkle 3s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
.g-part{position:absolute;top:-6%;font-size:13px;pointer-events:none;animation:falldrift linear infinite;opacity:.85;z-index:8}
@keyframes falldrift{0%{transform:translate(0,-4vh) rotate(0)}100%{transform:translate(-9vw,80vh) rotate(320deg)}}
.g-rain{position:absolute;top:-10%;width:1.5px;height:16px;background:linear-gradient(#fff0,#cfe3f7cc);pointer-events:none;animation:raindrop .9s linear infinite;z-index:8}
@keyframes raindrop{to{transform:translateY(95vh)}}
.g-firefly{position:absolute;width:5px;height:5px;border-radius:50%;background:#ffe97a;box-shadow:0 0 8px 3px #ffe97a88;pointer-events:none;animation:fly 6s ease-in-out infinite;z-index:8}
@keyframes fly{0%,100%{transform:translate(0,0);opacity:.2}25%{transform:translate(14px,-16px);opacity:1}50%{transform:translate(-8px,-30px);opacity:.4}75%{transform:translate(10px,-10px);opacity:1}}
.g-fly{position:absolute;font-size:14px;pointer-events:none;animation:butterfly 22s ease-in-out infinite;z-index:9}
@keyframes butterfly{0%{transform:translate(0,0) rotate(-8deg)}20%{transform:translate(18vw,-6vh) rotate(10deg)}45%{transform:translate(34vw,3vh) rotate(-10deg)}70%{transform:translate(15vw,9vh) rotate(8deg)}100%{transform:translate(0,0) rotate(-8deg)}}
/* koi SVG */
.riverflow{animation:flow 6s linear infinite}
@keyframes flow{to{stroke-dashoffset:-66}}
.koi{transform-box:fill-box;transform-origin:center;--ax:120px;--by:34px;animation:koiCCW 38s linear infinite}
.koi.k2{--ax:88px;--by:24px;animation:koiCW 46s linear infinite;animation-delay:-12s}
.koi.k3{--ax:150px;--by:30px;animation:koiCCW 54s linear infinite;animation-delay:-27s}
.koi.k4{--ax:100px;--by:26px;animation:koiCW 60s linear infinite;animation-delay:-30s}
.koi .tail{transform-box:fill-box;transform-origin:left center;animation:tailwag 1.1s ease-in-out infinite alternate}
@keyframes tailwag{from{transform:rotate(-11deg)}to{transform:rotate(11deg)}}
@keyframes koiCCW{
 0%{transform:translate(var(--ax),0) rotate(-90deg)}
 12.5%{transform:translate(calc(var(--ax)*.707),calc(var(--by)*.707)) rotate(-45deg)}
 25%{transform:translate(0px,var(--by)) rotate(0deg)}
 37.5%{transform:translate(calc(var(--ax)*-.707),calc(var(--by)*.707)) rotate(45deg)}
 50%{transform:translate(calc(var(--ax)*-1),0px) rotate(90deg)}
 62.5%{transform:translate(calc(var(--ax)*-.707),calc(var(--by)*-.707)) rotate(135deg)}
 75%{transform:translate(0px,calc(var(--by)*-1)) rotate(180deg)}
 87.5%{transform:translate(calc(var(--ax)*.707),calc(var(--by)*-.707)) rotate(225deg)}
 100%{transform:translate(var(--ax),0) rotate(270deg)}
}
@keyframes koiCW{
 0%{transform:translate(var(--ax),0) rotate(-270deg)}
 12.5%{transform:translate(calc(var(--ax)*.707),calc(var(--by)*-.707)) rotate(-315deg)}
 25%{transform:translate(0px,calc(var(--by)*-1)) rotate(-360deg)}
 37.5%{transform:translate(calc(var(--ax)*-.707),calc(var(--by)*-.707)) rotate(-405deg)}
 50%{transform:translate(calc(var(--ax)*-1),0px) rotate(-450deg)}
 62.5%{transform:translate(calc(var(--ax)*-.707),calc(var(--by)*.707)) rotate(-495deg)}
 75%{transform:translate(0px,var(--by)) rotate(-540deg)}
 87.5%{transform:translate(calc(var(--ax)*.707),calc(var(--by)*.707)) rotate(-585deg)}
 100%{transform:translate(var(--ax),0) rotate(-630deg)}
}
.koi.dart{animation-duration:12s !important}
/* efectos táctiles */
.g-ripple{position:absolute;border:2px solid #ffffffaa;border-radius:50%;pointer-events:none;animation:rippleout 1.1s ease-out forwards;z-index:9}
@keyframes rippleout{from{width:8px;height:8px;opacity:.9;transform:translate(-50%,-50%)}to{width:90px;height:90px;opacity:0;transform:translate(-50%,-50%)}}
.g-burst{position:absolute;font-size:14px;pointer-events:none;animation:burstfall 1.6s ease-in forwards;z-index:9}
@keyframes burstfall{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--bx),64px) rotate(200deg);opacity:0}}
.g-hot{position:absolute;transform:translate(-50%,-50%);z-index:6;cursor:pointer;border-radius:50%}
.g-hot:hover{background:#ffffff14}
.bellglow{animation:bellring .8s ease-in-out}
@keyframes bellring{0%,100%{transform:rotate(0)}25%{transform:rotate(9deg)}55%{transform:rotate(-8deg)}80%{transform:rotate(4deg)}}
/* áreas */
.g-area{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column-reverse;align-items:center;gap:4px;cursor:pointer;z-index:7;padding:9px}
.g-area:hover{z-index:12}
.g-area .dot{width:10px;height:10px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px #ffffff30,0 0 12px 2px #ffffff50;animation:areapulse 3s ease-in-out infinite}
@keyframes areapulse{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
.g-area .lbl{font-size:.55rem;font-weight:700;letter-spacing:.04em;color:#fff;background:#00000060;padding:2px 7px;border-radius:99px;backdrop-filter:blur(3px);white-space:nowrap;opacity:0;transform:translateY(5px) scale(.88);transition:opacity .22s ease,transform .22s ease;pointer-events:none}
.g-area:hover .lbl,.g-area:active .lbl,.g-area:focus-visible .lbl{opacity:1;transform:translateY(0) scale(1)}
.g-area:hover .dot{background:var(--kin-bright)}
/* personajes con cuerpo (yukata) */
.g-char{position:absolute;transform:translate(-50%,-75%);display:flex;flex-direction:column;align-items:center;z-index:10;transition:left 1.8s cubic-bezier(.45,.05,.35,1),top 1.8s cubic-bezier(.45,.05,.35,1)}
.g-char .rig{position:relative;display:flex;flex-direction:column;align-items:center;animation:idlebob 3.4s ease-in-out infinite;transform-origin:50% 100%;cursor:pointer}
.g-char .head{font-size:32px;line-height:1;z-index:3;filter:drop-shadow(0 2px 3px #0004);animation:headtilt 5s ease-in-out infinite}
@keyframes headtilt{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
.g-char .robe{width:30px;height:31px;border-radius:13px 13px 12px 12px;background:linear-gradient(180deg,color-mix(in srgb,var(--mc) 88%,#fff),var(--mc) 45%,color-mix(in srgb,var(--mc) 62%,#000));margin-top:-8px;position:relative;z-index:2;box-shadow:inset -3px -4px 6px #00000026,inset 2px 2px 4px #ffffff2a}
.g-char .robe::before{content:"";position:absolute;left:50%;top:0;transform:translateX(-50%);width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-top:10px solid #f6f1e6;filter:drop-shadow(0 1px 0 #00000022)}
.g-char .robe::after{content:"";position:absolute;left:0;right:0;bottom:9px;height:6px;background:linear-gradient(180deg,color-mix(in srgb,var(--mc) 30%,#141a16),color-mix(in srgb,var(--mc) 45%,#000));box-shadow:0 1px 0 #ffffff1c}
.g-char .obiknot{position:absolute;right:-2px;bottom:10px;width:7px;height:7px;border-radius:3px;background:color-mix(in srgb,var(--mc) 28%,#101512);z-index:3}
.g-char .arm{position:absolute;top:2px;width:10px;height:20px;border-radius:6px 6px 8px 8px;background:linear-gradient(180deg,var(--mc),color-mix(in srgb,var(--mc) 68%,#000));transform-origin:50% 12%;z-index:1;box-shadow:inset -2px -2px 3px #0000002a}
.g-char .arm::after{content:"";position:absolute;left:50%;bottom:-3px;transform:translateX(-50%);width:7px;height:7px;border-radius:50%;background:#f0c9a2;box-shadow:inset -1px -1px 1px #0003}
.g-char .arm.l{left:-7px;animation:armswing 3.4s ease-in-out infinite}
.g-char .arm.r{right:-7px;animation:armswing 3.4s ease-in-out infinite reverse}
@keyframes armswing{0%,100%{transform:rotate(7deg)}50%{transform:rotate(-7deg)}}
.g-char .legs{display:flex;gap:5px;margin-top:-3px;z-index:1}
.g-char .leg{width:8px;height:10px;border-radius:3px 3px 2px 2px;background:color-mix(in srgb,var(--mc) 38%,#1c2620);transform-origin:top center;position:relative}
.g-char .leg::after{content:"";position:absolute;left:-1px;bottom:-3px;width:11px;height:4px;border-radius:2px 4px 2px 2px;background:#4a3527;box-shadow:0 1px 1px #0004}
.g-char.walking .rig{animation:hopwalk .4s ease-in-out infinite}
.g-char.walking .leg.l{animation:step .4s ease-in-out infinite}
.g-char.walking .leg.r{animation:step .4s ease-in-out infinite reverse}
@keyframes step{0%,100%{transform:rotate(20deg)}50%{transform:rotate(-20deg)}}
.g-char.walking .arm.l{animation:armswing .4s ease-in-out infinite}
.g-char.walking .arm.r{animation:armswing .4s ease-in-out infinite reverse}
.g-char .gshadow{width:36px;height:8px;border-radius:50%;background:#00000040;margin-top:3px;animation:shadowbob 3.4s ease-in-out infinite}
.g-char .tag{margin-top:3px;font-size:.58rem;font-weight:700;color:#fff;background:#00000055;border:1.5px solid transparent;padding:1.5px 8px;border-radius:99px;backdrop-filter:blur(3px);white-space:nowrap}
.g-char.me .tag{border-color:var(--kin-bright);background:#00000075}
.g-char.me .rig::before{content:"▼";position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--kin-bright);animation:idlebob 1.6s ease-in-out infinite}
.g-char .bubble{position:absolute;top:-26px;left:60%;font-size:15px;background:#ffffffee;border-radius:10px 10px 10px 2px;padding:2px 6px;animation:pop .3s,fade 0.4s 1.6s forwards;z-index:12}
@keyframes idlebob{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-4px) scale(.99,1.015)}}
@keyframes shadowbob{0%,100%{transform:scaleX(1);opacity:.75}50%{transform:scaleX(.84);opacity:.5}}
@keyframes hopwalk{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-9px) rotate(2deg)}}
/* pájaros */
.g-bird{position:absolute;width:27px;height:19px;pointer-events:none;z-index:7;animation:birdfly linear infinite}
.g-bird.rev{animation-name:birdflyrev}
.g-bird .bob{width:100%;height:100%;animation:birdbob 2.4s ease-in-out infinite alternate}
@keyframes birdfly{from{transform:translateX(-16vw)}to{transform:translateX(114vw)}}
@keyframes birdflyrev{from{transform:translateX(114vw) scaleX(-1)}to{transform:translateX(-16vw) scaleX(-1)}}
@keyframes birdbob{from{transform:translateY(-7px) rotate(-3deg)}to{transform:translateY(7px) rotate(3deg)}}
.g-bird svg{width:100%;height:100%;overflow:visible}
.g-bird .wingf{transform-box:fill-box;transform-origin:75% 85%;animation:flap .32s ease-in-out infinite alternate}
@keyframes flap{from{transform:rotate(30deg)}to{transform:rotate(-34deg)}}
#garden-scene .heat{position:absolute;inset:0;pointer-events:none;background:var(--g-tint);mix-blend-mode:soft-light}

      const mw={pts:0,raw:0,xpW:0,A:0,Wsched:0,Wdone:0,PJ:0,dR:0,E:null,scheduledN:0,doneN:0,completedAll:false,catPts:{},cats:new Set(),backfills:0,crowns:[],awards:[],kudosIn:0,kudosOut:0,sponsoredOut:0,improvBonus:0,perfect:false,absent:false};
      pm.week.set(wk,mw);
      const acts=(actsByMemWeek.get(mem.id)||new Map()).get(wk)||[];
      const sched=acts.filter(a=>!a.canceled);
      mw.scheduledN=sched.length;
      // W_sched ponderado por BASE
      mw.Wsched=sum(sched.map(a=>CONFIG.BASE[a.tier]||10));
      const mStr=mStreakMult(pm.weekStreak);
      const restSet=rests.get(mem.id)||new Set();
      const hardMap=hards.get(mem.id)||new Map();
      // día a día
      for(let di=0;di<7;di++){
        const day=addDays(wk,di);
        if(day>todayK)break;
        if(dkey(new Date(mem.joinT))>day)continue;
        const dayActs=sched.filter(a=>a.date===day);
        const dayDone=dayActs.filter(a=>a.done&&!a.voided).sort((x,y)=>x.done.t-y.done.t);
        const schedCountDay=dayActs.length;
        const hardAuto=schedCountDay>=4, hardMan=hardMap.has(day);
        let dayPts=0,improvN=0,unlinkedN=0,firstDone=false;
        const drIdx={}, dayCats=new Set();
        for(const a of dayDone){
          let tier=a.tier, evidDown=false;
          const tn=+tier.slice(1);
          if(tn>=CONFIG.EVIDENCE_FROM&&!((a.done.note||'').length>=CONFIG.EVIDENCE_MIN)){tier=CONFIG.EVIDENCE_DOWNGRADE;evidDown=true}
          let base=CONFIG.BASE[tier];
          const improvised=a.schedT>=dayStart(a.date)&&!a.rescheduled;
          if(improvised){improvN++;base*=CONFIG.IMPROV_FACTOR}
          const overImprov=improvised&&improvN>CONFIG.IMPROV_DAILY_CAP;
          if(a.rescheduled)base*=CONFIG.RESCHED_FACTOR;
          // timing
          const slotTs=a.time?fromKey(a.date).setHours(+a.time.slice(0,2),+a.time.slice(3,5),0,0):null;
          const dEnd=dayStart(a.date)+864e5;
          let timing='onTime',wt=CONFIG.WT.onTime;
          if(a.done.t>=dEnd){timing='backfill';wt=CONFIG.WT.backfill;mw.backfills++}
          else if(slotTs&&Math.abs(a.done.t-slotTs)>CONFIG.ONTIME_GRACE_MIN*6e4&&a.done.t>slotTs){timing='late';wt=CONFIG.WT.late}
          if(a.rescheduled){wt=CONFIG.WT.resched}
          a._timing=timing;
          // vinculado a meta
          const g=a.goalId?D.goals.get(a.goalId):null;
          const linked=g&&estadoAt(g,a.done.t)==='En progreso'&&(!g.f.kpiUnit||a.done.kpi!=null);
          if(!g){unlinkedN++}
          // multiplicadores aditivos
          let M=1+mStr+CONFIG.M_TIMING[timing==='backfill'?'backfill':timing==='late'?'late':'onTime']
            +(linked?CONFIG.M_GOAL:0)
            +((mem.focus&&mem.focus===a.cat)?CONFIG.M_FOCUS:0)
            +((hardAuto||hardMan)?CONFIG.M_HARDDAY:0)
            +(!firstDone?CONFIG.M_FIRST:0)
            +((g&&progresoAt(g,a.done.t)>=CONFIG.FINAL_AT)?CONFIG.M_FINAL:0);
          M=clamp(M,CONFIG.M_MIN,CONFIG.M_MAX);
          firstDone=true;
          let pts=base*M;
          // regreso del héroe ×2
          let comeback=false;
          if(pm.lastDoneT&&a.done.t-pm.lastDoneT>=CONFIG.COMEBACK_DAYS*864e5){comeback=true;pts*=CONFIG.COMEBACK_MULT;mw.xpW+=CONFIG.COMEBACK_XP;pm.stats.heroReturnPend=wk}
          pm.lastDoneT=a.done.t;
          // ficha doble
          if(pm.fichaDoble){pts*=2;pm.fichaDoble=false;a._ficha=true}
          if(pm.stats.honorOkAt!=null&&a.done.t>=pm.stats.honorOkAt)pts*=(1+CONFIG.HONOR_BONUS);
          // rendimientos decrecientes por categoría/día
          const k=drIdx[a.cat]||0;drIdx[a.cat]=k+1;
          pts*=CONFIG.DR[Math.min(k,CONFIG.DR.length-1)];
          a._dr=CONFIG.DR[Math.min(k,CONFIG.DR.length-1)];
          // topes
          let toXpOnly=0;
          if(overImprov||( !g&&unlinkedN>CONFIG.UNLINKED_DAILY_CAP)){toXpOnly=pts;pts=0}
          const catWeekN=(mw.catN=mw.catN||{});catWeekN[a.cat]=(catWeekN[a.cat]||0)+1;
          if(catWeekN[a.cat]>CONFIG.WEEK_CAT_CAP){toXpOnly+=pts;pts=0}
          if(dayPts+pts>CONFIG.DAILY_CAP){toXpOnly+=dayPts+pts-CONFIG.DAILY_CAP;pts=Math.max(0,CONFIG.DAILY_CAP-dayPts)}
          pts=Math.round(pts);
          dayPts+=pts;
          a._pts=pts;a._M=M;a._evidDown=evidDown;a._comeback=comeback;
          mw.pts+=pts;mw.raw+=pts;
          const xpGain=pts+Math.round(toXpOnly*CONFIG.OVERFLOW_XP);
          mw.xpW+=xpGain;
          pm.senda[a.cat]=(pm.senda[a.cat]||0)+xpGain;
          mw.catPts[a.cat]=(mw.catPts[a.cat]||0)+pts;
          mw.cats.add(a.cat);dayCats.add(a.cat);
          mw.doneN++;
          // A ponderado (solo programadas cuentan en Wdone)
          const wBase=CONFIG.BASE[a.tier]||10;
          if(!improvised)mw.Wdone+=wBase*wt; else mw.improvBonus+=wBase*.5*wt;
          // cofres deterministas
          if(timing==='onTime'&&g&&srand(a.done.evId)<CONFIG.CHEST_P){
            pm.chests++;const r2=srand(a.done.evId+'d');
            if(r2<.6)mw.xpW+=25;
            else if(r2<.85)pm.quotes.add(Math.floor(srand(a.done.evId+'q')*QUOTES.length));
            else if(r2<.95)pm.freezes=Math.min(CONFIG.FREEZE_CAP,pm.freezes+1);
            else pm.fichaDoble=true;
            a._chest=r2<.6?'xp':r2<.85?'semilla':r2<.95?'piedra':'ficha';
          }
          // KPI y stats
          if(g&&a.done.kpi!=null){g.kpiSum+=(+a.done.kpi||0);pm.stats.kpiByCat[a.cat]=(pm.stats.kpiByCat[a.cat]||0)+(+a.done.kpi||0)}
          const st=pm.stats;
          if(!improvised)st.plannedDone++;
          const hh=new Date(a.done.t).getHours();
          if(hh<8)st.before8++;
          if(a.tier==='T5'&&hh<7)st.t5before7++;
          if(a.tier==='T5')st.t5ByCat[a.cat]=(st.t5ByCat[a.cat]||0)+1;
          st.doneByCat[a.cat]=(st.doneByCat[a.cat]||0)+1;
          if((a.done.note||'').length>=CONFIG.EVIDENCE_MIN)st.evidByCat[a.cat]=(st.evidByCat[a.cat]||0)+1;
          // racha por categoría (días consecutivos)
          if(st.catLastDay[a.cat]===addDays(day,-1))st.catDayRun[a.cat]=(st.catDayRun[a.cat]||0)+1;
          else if(st.catLastDay[a.cat]!==day)st.catDayRun[a.cat]=1;
          st.catLastDay[a.cat]=day;
          st.catDayRunMax[a.cat]=Math.max(st.catDayRunMax[a.cat]||0,st.catDayRun[a.cat]||0);
          // eco: misma actividad semanas seguidas
          const ek=a.title.toLowerCase().trim();
          const er=st.echo[ek];
          if(er&&er.wk===addDays(wk,-7))er.run++;else if(!er||er.wk!==wk)st.echo[ek]={run:1};
          st.echo[ek].wk=wk;st.echoMax=Math.max(st.echoMax,st.echo[ek].run);
        }
        pm.stats.dayCatsMax=Math.max(pm.stats.dayCatsMax,dayCats.size);
        // racha diaria (solo días ya transcurridos o hoy con logro)
        const qualifies=dayDone.some(a=>a.schedT<dayStart(a.date)||a.rescheduled);
        const isRest=restSet.has(day);
        const dayOver=day<todayK;
        if(qualifies){pm.dayStreak++;pm.dayStreakMax=Math.max(pm.dayStreakMax,pm.dayStreak);
          const ms=CONFIG.STREAK_MS.find(x=>x.d===pm.dayStreak);
          if(ms){pm.streakXP+=ms.xp;pm.streakHits[ms.d]=(pm.streakHits[ms.d]||0)+1}}
        else if(isRest){/* neutro */}
        else if(dayOver){
          const rep=repairs.find(r=>r.m===mem.id&&r.date===day);
          if(rep&&pm.repairsSeason<CONFIG.REPAIR_SEASON){pm.repairsSeason++;mw.pts=Math.max(0,mw.pts-CONFIG.REPAIR_COST);/* racha sobrevive */}
          else if(pm.freezes>0&&pm.dayStreak>0){pm.freezes--;pm._frozeDay=day;pm._frozeStreak=pm.dayStreak}
          else pm.dayStreak=0;
        }
      }
      // pendientes (48h) — para la UI
      for(const a of sched){
        if(a.done||a.canceled||a.voided)continue;
        const dEnd=dayStart(a.date)+864e5;
        if(now>=dEnd&&now<dEnd+CONFIG.BACKFILL_H*36e5)pm.pend.push(a);
      }
      // cierre de semana
      if(closed){
        const wsBase=mw.Wsched;
        mw.absent=wsBase===0;
        if(!mw.absent){
          let A=mw.Wdone/wsBase;
          const allDone=sched.every(a=>a.done&&!a.voided);
          mw.completedAll=allDone;
          if(allDone&&mw.improvBonus>0)A=Math.min(CONFIG.A_MAX,A+mw.improvBonus/wsBase);
          mw.A=clamp(A,0,CONFIG.A_MAX);
        }
        // media móvil para clamp anti-relleno y Cap_m
        const hist=[];for(let b=1;b<=CONFIG.CAPM_WIN;b++){const pw=pm.week.get(addDays(wk,-7*b));if(pw)hist.push(pw.Wsched)}
        const hist4=hist.slice(0,4).filter(x=>x>0);
        mw.WschedEff=hist4.length?Math.min(wsBase,1.5*median(hist4)+100):wsBase;
        // rating
        let dR=0,E=null;
        if(mw.absent){
          pm.absentRun++;
          if(pm.absentRun>1&&pm.absentLoss>CONFIG.ABSENT_CAP){dR=Math.max(CONFIG.ABSENT_PEN,CONFIG.ABSENT_CAP-pm.absentLoss);pm.absentLoss+=dR}
        }else{
          const wasAway=pm.lastDoneBeforeWeek!=null&&(dayStart(wk)-pm.lastDoneBeforeWeek)>=CONFIG.REENTRY_DAYS*864e5;
          const Rt=clamp(CONFIG.RBASE+400*Math.log10(Math.max(1,mw.WschedEff)/CONFIG.LREF),CONFIG.RT_MIN,CONFIG.RT_MAX);
          E=1/(1+Math.pow(10,(Rt-pm.R)/400));
          let K=pm.played<CONFIG.PROV_WEEKS?CONFIG.K.prov:pm.R<1400?CONFIG.K.u1400:pm.R<1800?CONFIG.K.u1800:CONFIG.K.over;
          if(wasAway)K=CONFIG.K.reentry;
          dR=K*(mw.A-E);
          if(dR<0&&mem.amort)dR*=CONFIG.AMORT;
          if(wasAway)dR=Math.max(dR,CONFIG.REENTRY_FLOOR);
          pm.played++;pm.absentRun=0;pm.absentLoss=0;
          if(wasAway&&mw.A>=.7)pm.stats.heroReturn=true;
        }
        const peakFloor=RITMO_TIERS[Math.max(0,pm.peakTier)].min-100;
        pm.R=clamp(pm.R+dR,Math.max(CONFIG.RFLOOR,peakFloor),3000);
        mw.dR=Math.round(dR);mw.E=E;
        pm.peakR=Math.max(pm.peakR,pm.R);pm.stats.peakR=pm.peakR;
        pm.peakTier=Math.max(pm.peakTier,ritmoTierIdx(pm.R));
        pm.ratingLog.push({wk,R:Math.round(pm.R),dR:Math.round(dR),A:mw.A,absent:mw.absent});
        // racha semanal + piedras + impecable
        if(!mw.absent&&mw.A>=CONFIG.WSTREAK_MIN_A){pm.weekStreak++;if(mw.A>=CONFIG.FREEZE_EARN_A)pm.freezes=Math.min(CONFIG.FREEZE_CAP,pm.freezes+1)}
        else pm.weekStreak=Math.floor(pm.weekStreak/2);
        if(!mw.absent&&mw.completedAll&&mw.A>=.999&&mw.scheduledN>=CONFIG.PERFECT_MIN){
          mw.perfect=true;mw.xpW+=CONFIG.PERFECT.xp;mw.pts+=CONFIG.PERFECT.pts;pm.freezes=Math.min(CONFIG.FREEZE_CAP,pm.freezes+1);
          pm.stats.perfectWeeks++;pm.stats.perfectSeason++;pm.stats.perfectSeasonMax=Math.max(pm.stats.perfectSeasonMax,pm.stats.perfectSeason);
        }
        if(mw.backfills===0&&mw.doneN>0)pm.stats.weeksNoBackfill++;
        // honestidad: semanas sin anulaciones
        const weekVoids=sched.some(a=>a.voided);
        if(mw.doneN>0){pm.honorRun=weekVoids?0:pm.honorRun+1;if(pm.honorRun>=CONFIG.HONOR_WEEKS&&!pm.stats.honorOk){pm.stats.honorOk=true;pm.stats.honorOkAt=weekCloseTs(wk)}}
        // rachas por categoría (semanas)
        for(const c of mw.cats){
          const st=pm.stats;
          if(st.catLastWeek[c]===addDays(wk,-7))st.catWeekRun[c]=(st.catWeekRun[c]||0)+1;else st.catWeekRun[c]=1;
          st.catLastWeek[c]=wk;
        }
        pm.stats.weekCatsMax=Math.max(pm.stats.weekCatsMax,mw.cats.size);
        // temporada: por categoría
        const cs=pm.stats.catSeason=pm.stats.catSeason||{};
        for(const[c,n]of Object.entries(mw.catN||{})){cs[c]=(cs[c]||0)+n}
        pm.stats.catSeasonMax=pm.stats.catSeasonMax||{};
        for(const[c,n]of Object.entries(cs))pm.stats.catSeasonMax[c]=Math.max(pm.stats.catSeasonMax[c]||0,n);
      }
      pm.lastDoneBeforeWeek=pm.lastDoneT;
    }
    /* kudos & padrinos de la semana */
    const givers={},sgivers={};
    for(const k of kudos){if(monday(dkey(new Date(k.t)))!==wk)continue;
      givers[k.m]=(givers[k.m]||0)+1;
      if(givers[k.m]<=CONFIG.KUDOS_WEEK){
        const rm=D.perM.get(k.toM),gm=D.perM.get(k.m);
        const rw=rm&&rm.week.get(wk);if(rw){rw.pts+=CONFIG.KUDOS_PTS;rw.kudosIn++;}
        const gw=gm&&gm.week.get(wk);if(gw)gw.kudosOut++;
      }}
    for(const s of sponsors){if(monday(dkey(new Date(s.t)))!==wk)continue;
      sgivers[s.m]=(sgivers[s.m]||0)+1;
      if(sgivers[s.m]<=CONFIG.SPONSOR_WEEK){
        const rm=D.perM.get(s.toM),gm=D.perM.get(s.m);
        const rw=rm&&rm.week.get(wk),gw=gm&&gm.week.get(wk);
        if(rw&&gw&&gw.pts>=CONFIG.SPONSOR_PTS){gw.pts-=CONFIG.SPONSOR_PTS;rw.pts+=CONFIG.SPONSOR_PTS;gw.sponsoredOut++;
          const gs=D.perM.get(s.m);if(gs)gs.stats.sponsorsGiven++;}
      }}
    /* PJ, coronas, familia (solo cerradas) */
    if(closed){
      let famTotal=0,famCap=0,anySched=false;
      const rows=[];
      for(const mem of memArr){
        const pm=D.perM.get(mem.id);const mw=pm&&pm.week.get(wk);
        if(!mw)continue;
        famTotal+=mw.pts;
        // Cap_m: mediana de Wsched de las últimas 6 semanas con plan
        const hist=[];for(let b=0;b<CONFIG.CAPM_WIN;b++){const pw=pm.week.get(addDays(wk,-7*b));if(pw&&pw.Wsched>0)hist.push(pw.Wsched)}
        const capM=Math.max(CONFIG.CAPM_FLOOR,median(hist)||0);
        mw.capM=capM;famCap+=capM;
        if(mw.Wsched>0)anySched=true;
        const amb=clamp(mw.Wsched/capM,0,CONFIG.AMB_MAX);
        const activeGoalCats=new Set((goalsByMem.get(mem.id)||[]).filter(g=>estadoAt(g,weekCloseTs(wk))==='En progreso').map(g=>g.f.area));
        const denom=Math.max(1,Math.min(activeGoalCats.size||1,CONFIG.BAL_DENOM));
        const bal=clamp(mw.cats.size/denom,0,1);
        mw.amb=amb;mw.bal=bal;
        mw.PJ=Math.round(1000*(CONFIG.PJ_W.a*(mw.A/CONFIG.A_MAX)+CONFIG.PJ_W.amb*(amb/CONFIG.AMB_MAX)+CONFIG.PJ_W.bal*bal));
        rows.push({m:mem.id,mw});
      }
      wrec.famTotal=Math.round(famTotal);
      wrec.famTarget=Math.round(CONFIG.FAM_FACTOR*famCap);
      wrec.famMet=anySched&&famTotal>=wrec.famTarget&&wrec.famTarget>0;
      if(wrec.famMet){D.famStreak++;for(const r of rows)r.mw.xpW+=CONFIG.FAM_XP}
      else if(anySched)D.famStreak=0;
      D.famStreakMax=Math.max(D.famStreakMax,D.famStreak);
      for(const mem of memArr){const pm=D.perM.get(mem.id);if(pm){pm.stats.famStreakMax=D.famStreakMax}}
      // orden de liga
      rows.sort((x,y)=>y.mw.PJ-x.mw.PJ||y.mw.A-x.mw.A||y.mw.pts-x.mw.pts);
      wrec.rank=rows.map(r=>r.m);
      // coronas por categoría
      for(const c of CAT_IDS){
        let best=null,bestPts=0;
        for(const r of rows){const n=(r.mw.catN||{})[c]||0;const p=r.mw.catPts[c]||0;
          if(n>=CONFIG.CROWN_MIN&&p>bestPts){best=r.m;bestPts=p}}
        if(best){wrec.crowns[c]=best;const pm=D.perM.get(best);pm.week.get(wk).crowns.push(c)}
      }
      // premios
      let bestConst=null,bestA=-1;
      for(const r of rows)if(r.mw.Wsched>0&&r.mw.A>bestA){bestA=r.mw.A;bestConst=r.m}
      if(bestConst)wrec.awards.constancia=bestConst;
      let bestHeart=null,bestK=-1;
      for(const r of rows)if(r.mw.kudosIn>bestK&&r.mw.kudosIn>0){bestK=r.mw.kudosIn;bestHeart=r.m}
      if(bestHeart){wrec.awards.corazon=bestHeart;D.perM.get(bestHeart).stats.heartWins++}
      const prev=D.weeks.get(addDays(wk,-7));
      let bestImp=null,bestD=CONFIG.IMPROVED_MIN-1;
      for(const r of rows){const pw=D.perM.get(r.m).week.get(addDays(wk,-7));
        if(!pw)continue;const dd=r.mw.PJ-(pw.PJ||0);
        if(dd>bestD&&!(prev&&prev.awards.mejorado===r.m)){bestD=dd;bestImp=r.m}}
      if(bestImp)wrec.awards.mejorado=bestImp;
      wrec.impecables=rows.filter(r=>r.mw.perfect).map(r=>r.m);
      // sello
      const seal=seals.get(wk);
      if(seal&&Array.isArray(seal.att)&&memArr.every(m=>m.joinT>weekEndTs(wk)||seal.att.includes(m.id))){
        wrec.sealed=true;wrec.sealAtt=seal.att.slice(0,12);
        for(const mem of memArr){const pm=D.perM.get(mem.id);const mw2=pm&&pm.week.get(wk);if(mw2){mw2.xpW+=CONFIG.SEAL_XP;pm.stats.sealsSeason++;pm.stats.sealsSeasonMax=Math.max(pm.stats.sealsSeasonMax,pm.stats.sealsSeason)}}
      }
      // fin de temporada: compresión + reinicios
      if(isSeasonEnd){
        for(const mem of memArr){const pm=D.perM.get(mem.id);
          pm.R=pm.R+CONFIG.SEASON_COMPRESS*(CONFIG.R0-pm.R);
          pm.repairsSeason=0;pm.stats.perfectSeason=0;pm.stats.sealsSeason=0;pm.stats.catSeason={};
          pm.stats.kudosSeason=0;
        }
      }
    }
  }
  /* kudos por temporada (para insignia) */
  for(const k of kudos){const pm=D.perM.get(k.toM);if(pm){pm.stats.kudosSeason=(pm.stats.kudosSeason||0)+1;pm.stats.kudosSeasonMax=Math.max(pm.stats.kudosSeasonMax,pm.stats.kudosSeason)}}
  /* metas completadas por categoría; anulados */
  for(const g of D.goals.values()){
    if(g.completedT){const pm=D.perM.get(g.m);if(pm)pm.stats.goalsDoneByCat[g.f.area]=(pm.stats.goalsDoneByCat[g.f.area]||0)+1}
  }
  for(const aid of voids){const a=D.acts.get(aid);if(a){const pm=D.perM.get(a.m);if(pm)pm.stats.voided++}}
  /* XP total, niveles, insignias */
  for(const mem of memArr){
    const pm=D.perM.get(mem.id);
    let xp=150;
    for(const[,mw]of pm.week)xp+=mw.xpW;
    for(const g of D.goals.values())if(g.m===mem.id){if(g.completedT)xp+=CONFIG.GOAL_XP;if(g.honorClosed)xp+=CONFIG.HONOR_XP}
    xp+=pm.streakXP;
    pm.stats.dayStreakMax=pm.dayStreakMax;
    for(const b of BADGES){let on=false;try{on=b.t(pm.stats)}catch(e){}if(on){pm.badges.add(b.id);xp+=b.xp}}
    pm.xp=xp;pm.level=levelOf(xp);
    const th=L=>L<=1?0:CONFIG.XP_TH(L);
    pm.levelPct=pm.level>=CONFIG.LEVEL_CAP?1:clamp((xp-th(pm.level))/(th(pm.level+1)-th(pm.level)),0,1);
    pm.sendaLv={};for(const[c,sxp]of Object.entries(pm.senda))pm.sendaLv[c]=sendaLevelOf(sxp);
    pm.tier=ritmoTier(pm.R);
  }
  /* semana actual en vivo */
  D.curWk=curWk;
  D.season=Math.floor((D.weekKeys.length-1)/CONFIG.SEASON_WEEKS)+1;
  D.seasonWeek=((D.weekKeys.length-1)%CONFIG.SEASON_WEEKS)+1;
  return D;
}

function avatarHtml(m,size=40,ringPct=null){
  const fs=size*.52;
  let ring='';
  if(ringPct!=null){
    const r=size/2+3, c=2*Math.PI*r;
    ring=`<svg style="position:absolute;inset:-5px;width:${size+10}px;height:${size+10}px" viewBox="0 0 ${size+10} ${size+10}"><circle cx="${(size+10)/2}" cy="${(size+10)/2}" r="${r}" fill="none" stroke="var(--sunken)" stroke-width="3"/><circle cx="${(size+10)/2}" cy="${(size+10)/2}" r="${r}" fill="none" stroke="var(--kin-bright)" stroke-width="3" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-ringPct)}" transform="rotate(-90 ${(size+10)/2} ${(size+10)/2})"/></svg>`;
  }
  const face=(m&&m.avatar)?avatarSvg(m.avatar,{size:Math.max(8,size-4),bg:mixHex('#FBFCF8',m.color,.18)}):'';
  return `<div style="position:relative;width:${size}px;height:${size}px;flex:none">${ring}<div class="avatar" style="width:${size}px;height:${size}px;font-size:${fs}px;border-color:${m?esc(m.color):'var(--line)'}${face?';overflow:hidden;padding:0':''}">${face||(m?esc(m.emoji):'?')}</div></div>`;
}

function gaugeSvg(R,size=150){
  const t=ritmoTier(R);
  const pct=clamp((R-800)/(2000-800),0,1);
  const a0=-210,a1=30,ang=a0+(a1-a0)*pct;
  const arc=(sa,ea,color,w)=>{const r=size/2-10;const cx=size/2,cy=size/2;
    const p=a=>[cx+r*Math.cos(a*Math.PI/180),cy+r*Math.sin(a*Math.PI/180)];
    const[x1,y1]=p(sa),[x2,y2]=p(ea);const large=(ea-sa)>180?1:0;
    return `<path d="M${x1.toFixed(1)} ${y1.toFixed(1)} A${r} ${r} 0 ${large} 1 ${x2.toFixed(1)} ${y2.toFixed(1)}" stroke="${color}" stroke-width="${w}" fill="none" stroke-linecap="round"/>`};
  return `<svg width="${size}" height="${size*.78}" viewBox="0 0 ${size} ${size*.82}">
    ${arc(a0,a1,'var(--sunken)',9)}${pct>0.005?arc(a0,ang,t.c,9):''}
    <text x="${size/2}" y="${size/2+4}" text-anchor="middle" style="font-family:var(--font-d);font-weight:900;font-size:${size*.19}px;fill:var(--ink)" class="num">${Math.round(R)}</text>
    <text x="${size/2}" y="${size/2+22}" text-anchor="middle" style="font-size:${size*.078}px;font-weight:700;fill:${t.c}">${t.e} ${t.n}</text>
  </svg>`;
}
function modal(html,onclose){

  back.innerHTML=`<div class="msheet"><div class="handle"></div>${html}</div>`;
  back.addEventListener('click',e=>{if(e.target===back){back.remove();onclose&&onclose()}});
  $('#modal-root').appendChild(back);
  return back;
}

function chime(kind='done'){
  try{
    const fam=D().fam;if(fam&&fam.mute)return;
    const ctx=chime.ctx||(chime.ctx=new (window.AudioContext||window.webkitAudioContext)());
    const notes=kind==='big'?[523.25,659.25,783.99,1046.5]:kind==='up'?[392,523.25,659.25]:[659.25,880];
    notes.forEach((f,i)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=f;
      g.gain.setValueAtTime(0,ctx.currentTime+i*.09);g.gain.linearRampToValueAtTime(.12,ctx.currentTime+i*.09+.02);
      g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+i*.09+.5);
      o.connect(g);g.connect(ctx.destination);o.start(ctx.currentTime+i*.09);o.stop(ctx.currentTime+i*.09+.55)});
  }catch(e){}
}
function confetti(n=90){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  let cv=$('#confetti-canvas');
  if(!cv){cv=document.createElement('canvas');cv.id='confetti-canvas';document.body.appendChild(cv)}
  cv.width=innerWidth;cv.height=innerHeight;
  const ctx=cv.getContext('2d');
  const cols=['#D9A62E','#6E9C6B','#C4693B','#8A79B8','#4E8D9E','#C25E72'];
  const ps=Array.from({length:n},()=>({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.4,vx:(Math.random()-.5)*2.4,vy:2+Math.random()*3.2,s:5+Math.random()*6,r:Math.random()*6.28,vr:(Math.random()-.5)*.25,c:cols[Math.random()*cols.length|0]}));
  let f=0;
  (function tick(){
    ctx.clearRect(0,0,cv.width,cv.height);
    for(const p of ps){p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);ctx.restore()}
    if(++f<160)requestAnimationFrame(tick);else cv.remove();
  })();
}

function pinPrompt(mid){
  const d=D(),m=d.members.get(mid);

  let pin='';
  const mb=modal(`<div style="text-align:center">

  </div>`);
  mb.querySelector('.msheet').style.maxWidth='380px';

  const paint=()=>dots.forEach((el,i)=>el.classList.toggle('on',i<pin.length));

      else{pin='';paint();toast('PIN incorrecto');mb.querySelector('.pindots').animate([{transform:'translateX(0)'},{transform:'translateX(-8px)'},{transform:'translateX(8px)'},{transform:'translateX(0)'}],{duration:220})}

/* ---------- calendario externo (Google / Apple) · Puerto Rico = UTC-4 todo el año ---------- */
const CAL_TIER_MIN={T1:15,T2:30,T3:60,T4:120,T5:150};
function calDates(a){
  const [y,mo,dd]=a.date.split('-').map(Number);
  if(a.time&&/^\d{1,2}:\d{2}$/.test(a.time)){
    const [h,mi]=a.time.split(':').map(Number);
    const s=Date.UTC(y,mo-1,dd,h+4,mi), f=t=>new Date(t).toISOString().replace(/[-:]|\.\d{3}/g,'');
    let dur=(CAL_TIER_MIN[a.tier]||60)*6e4;
    if(a.end&&/^\d{1,2}:\d{2}$/.test(a.end)&&a.end>a.time){const [eh,em]=a.end.split(':').map(Number);dur=((eh-h)*60+(em-mi))*6e4}
    return {allDay:false,s:f(s),e:f(s+dur)};
  }
  const p=n=>String(n).padStart(2,'0'), nx=new Date(Date.UTC(y,mo-1,dd+1));
  return {allDay:true,s:`${y}${p(mo)}${p(dd)}`,e:`${nx.getUTCFullYear()}${p(nx.getUTCMonth()+1)}${p(nx.getUTCDate())}`};
}
function gcalUrl(a){
  const c=calDates(a),cat=CATS[a.cat]||CATS.otro;
  const p={action:'TEMPLATE',text:`${cat.e} ${a.title}`,dates:`${c.s}/${c.e}`,
    details:`${cat.n} · Familia PG Espacio Zen${a.notes?'\n'+a.notes:''}\n${location.origin+location.pathname}`};
  if(a.rrule)p.recur='RRULE:'+a.rrule;
  return 'https://calendar.google.com/calendar/render?'+new URLSearchParams(p).toString();
}
const icsEsc=s=>String(s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n');
function expandRepeatDates(startK,days,weeks){
  const out=[],total=Math.min(Math.max(weeks||1,1),12)*7;
  for(let i=0;i<total;i++){const k=addDays(startK,i);if(days.includes(fromKey(k).getDay()))out.push(k)}
  return out;
}
function icsForActivity(a){
  const c=calDates(a),cat=CATS[a.cat]||CATS.otro;
  const stamp=new Date().toISOString().replace(/[-:]|\.\d{3}/g,'');
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Familia PG Espacio Zen//ES','CALSCALE:GREGORIAN','METHOD:PUBLISH','BEGIN:VEVENT',
    `UID:${a.aid}@familia-zen`,`DTSTAMP:${stamp}`];
  if(c.allDay)L.push(`DTSTART;VALUE=DATE:${c.s}`,`DTEND;VALUE=DATE:${c.e}`);else L.push(`DTSTART:${c.s}`,`DTEND:${c.e}`);
  if(a.rrule)L.push('RRULE:'+a.rrule);
  L.push(`SUMMARY:${icsEsc(cat.e+' '+a.title)}`,
    `DESCRIPTION:${icsEsc(cat.n+' · Familia PG Espacio Zen'+(a.notes?'\n'+a.notes:''))}`,
    'STATUS:CONFIRMED','END:VEVENT','END:VCALENDAR');
  return L.join('\r\n')+'\r\n';
}
function downloadIcs(a){
  const u=URL.createObjectURL(new Blob([icsForActivity(a)],{type:'text/calendar;charset=utf-8'}));
  const fn=(a.title||'actividad').replace(/[\\\/:*?"<>|]/g,'').trim().slice(0,60)||'actividad';
  const l=document.createElement('a');l.href=u;l.download=fn+'.ics';document.body.appendChild(l);l.click();
  setTimeout(()=>{URL.revokeObjectURL(u);l.remove()},2000);
}

/* espacios de la fórmula: <span contenteditable> que se ajustan y saltan de línea; exponen .value/.placeholder como un input */
function fmlInit(root){
  $$('.fml',root).forEach(el=>{
    if(el.tagName!=='SPAN'||el._fml)return;el._fml=true;
    Object.defineProperty(el,'value',{get(){return el.textContent.replace(/\n+/g,' ')},set(v){el.textContent=v==null?'':String(v)}});
    Object.defineProperty(el,'placeholder',{get(){return el.dataset.ph||''}});
    el.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();el.blur()}});
    el.addEventListener('paste',e=>{e.preventDefault();const t=((e.clipboardData||window.clipboardData).getData('text/plain')||'').replace(/\s+/g,' ');document.execCommand('insertText',false,t)});
    el.addEventListener('input',()=>{if(!el.textContent)el.innerHTML=''});
    // ancho mínimo del espacio vacío = ancho de su pista (el caret queda centrado como en un input)
    try{const mm=document.createElement('span');mm.textContent=el.dataset.ph||'';mm.style.cssText='position:absolute;visibility:hidden;white-space:nowrap';el.parentNode.insertBefore(mm,el);const w=mm.offsetWidth;mm.remove();if(w)el.style.setProperty('--phw',(w+10)+'px')}catch(_e){}
  });
}

function gardenMood(w){
  if(!w)return {mood:'warm',rain:false,snow:false,cloudy:false,label:'Mayagüez 🌤'};
  const rain=(w.code>=51&&w.code<=67)||(w.code>=80&&w.code<=82)||w.code>=95;
  const snow=(w.code>=71&&w.code<=77)||w.code===85||w.code===86;
  const cloudy=w.code===3||w.code===45||w.code===48||rain;
  let mood=!w.day?'night':w.temp>=85?'hot':w.temp>=65?'warm':w.temp>=50?'mild':w.temp>=35?'cool':'cold';
  const icon=!w.day?'🌙':snow?'🌨':rain?'🌧':cloudy?'☁️':w.temp>=85?'🔥':'☀️';
  return {mood,rain,snow,cloudy,label:`Mayagüez ${w.temp}°F ${icon}`};
}
function gnote(freqs,dur=.5,vol=.09){
  try{const fam=D().fam;if(fam&&fam.mute)return;
    const ctx=chime.ctx||(chime.ctx=new (window.AudioContext||window.webkitAudioContext)());
    freqs.forEach((f,i)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=f;
      g.gain.setValueAtTime(0,ctx.currentTime+i*.06);g.gain.linearRampToValueAtTime(vol,ctx.currentTime+i*.06+.02);
      g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+i*.06+dur);
      o.connect(g);g.connect(ctx.destination);o.start(ctx.currentTime+i*.06);o.stop(ctx.currentTime+i*.06+dur+.05)});
  }catch(e){}
}

function postalSend(rec,text,title){
  copyTextSync(text);

  if(f&&navigator.share&&navigator.canShare&&navigator.canShare({files:[f]})){
    return navigator.share({files:[f],title,text}).then(()=>'shared').catch(e=>e&&e.name==='AbortError'?'abort':(postalDownload(rec)?'download':'copied'));
  }

let MEET=null;
function startMeeting(){

}
function endMeeting(){MEET=null;$('#presenter').hidden=true;$('#presenter').innerHTML='';rerender()}
function renderMeeting(){
  const d=D(),p=$('#presenter');
  if(!MEET)return;
  p.hidden=false;
  const N=11;
  const acts=[actPortada,actCosecha,actMuro,actTurnos,actTabla,actCoronas,actRitmo,actMetas,actCompromisos,actSello,actPostal];
  p.innerHTML=`<div class="stage" id="pstage"></div>

      <div class="acts">${Array.from({length:N},(_,i)=>`<i class="${i<=MEET.act?'on':''}"></i>`).join('')}</div>
      <div class="row" style="gap:8px">
        <button class="btn small sec" data-a="exit">✕</button>
        <button class="btn small ${MEET.act===N-1?'gold':''}" data-a="next">${MEET.act===N-1?'Cerrar':'Siguiente ›'}</button>
      </div>
    </div>`;
  acts[MEET.act]($('#pstage'),d);
  $('[data-a=prev]',p).onclick=()=>{if(MEET.act>0){MEET.act--;renderMeeting()}};
  $('[data-a=next]',p).onclick=()=>nextAct();
  $('[data-a=exit]',p).onclick=()=>endMeeting();
}
function nextAct(){
  const d=D();

    const missing=[...d.members.values()].filter(m=>{
      const n=[...d.acts.values()].filter(a=>a.m===m.id&&!a.canceled&&monday(a.date)===MEET.nextWk).length;
      return n===0});
    if(missing.length){toast(`Faltan compromisos de: ${missing.map(m=>m.name).join(', ')}`);return}

function runTests(){
  const T=[],ok=(name,cond,info)=>T.push({name,pass:!!cond,info:info||''});
  const W0=addDays(monday(dkey(new Date())),-21); // hace 3 semanas (lunes)
  const ts=(k,h=9)=>fromKey(k).getTime()+h*36e5;
  const mkFam=(evs)=>deriveState(evs,Date.now());
  const base=[{id:'f1',t:ts(W0,0),type:'family.create',name:'Test',code:'ABC123'},
    {id:'m1',t:ts(W0,0),type:'member.join',m:'M1',name:'Sofía',emoji:'🦊',color:'#33684B',pinHash:''}];
  // T1: fórmula de rating — carga de referencia => Rt=1200, E=0.5
  {
    const evs=[...base];
    // semana W0: 6 actividades T3+2 T4 => Wsched=6*35+2*55=320... usemos LREF exacto: 600 → 12 T4 + 3 T3... simple: 600 = 12×T4(55)=660 no. 600 = 6×T5(80)+2×T4(55)+... usemos 610 aproximado? Mejor: probamos monotonicidad y signo.
    for(let i=0;i<10;i++)evs.push({id:'a'+i,t:ts(addDays(W0,-3)),type:'act.sched',aid:'a'+i,m:'M1',cat:'ejercicio',title:'x'+i,tier:'T3',date:addDays(W0,i%7)});
    for(let i=0;i<10;i++)evs.push({id:'d'+i,t:ts(addDays(W0,i%7),10),type:'act.done',aid:'a'+i});
    const d=mkFam(evs);
    const log=d.perM.get('M1').ratingLog.find(x=>x.wk===W0);
    ok('T1 cierre de semana produce rating log',!!log);
    ok('T1 A=1.0 con todo completado',log&&Math.abs(log.A-1)<1e-9,log&&'A='+log.A);
    // Wsched=350 → Rt=1200+400*log10(350/600)=1106.4; E=1/(1+10^((1106.4-1200)/400))=0.633; dR=80*(1-0.633)=29.4
    const Rt=clamp(1200+400*Math.log10(350/600),900,1700);
    const E=1/(1+Math.pow(10,(Rt-1200)/400));
    ok('T1 ΔR = K·(A−E) provisional',log&&Math.abs(log.dR-Math.round(80*(1-E)))<=1,log&&`dR=${log.dR} esperado≈${Math.round(80*(1-E))}`);
  }
  // T2: fórmula PJ con ejemplo del diseño (directo)
  {
    const A=.865,amb=1,bal=.8;
    const PJ=Math.round(1000*(.55*(A/1.1)+.30*(amb/1.2)+.15*bal));
    ok('T2 PJ ejemplo Sofía ≈ 802 (exacto 803)',Math.abs(PJ-802.5)<=0.5,'PJ='+PJ);
    const A2=.671,amb2=clamp(700/640,0,1.2),bal2=1;
    const PJ2=Math.round(1000*(.55*(A2/1.1)+.30*(amb2/1.2)+.15*bal2));
    ok('T2 PJ ejemplo Julio = 759',PJ2===759,'PJ='+PJ2);
    const E=1/(1+Math.pow(10,((clamp(1200+400*Math.log10(170/600),900,1700))-1240)/400));
    ok('T2 E ejemplo Sofía ≈ 0.816',Math.abs(E-.816)<.002,'E='+E.toFixed(3));
  }
  // T3: rendimientos decrecientes misma categoría/día
  {
    const evs=[...base];
    const day=addDays(W0,1);
    for(let i=0;i<3;i++)evs.push({id:'b'+i,t:ts(addDays(W0,-2)),type:'act.sched',aid:'b'+i,m:'M1',cat:'lectura',title:'leer'+i,tier:'T2',date:day});
    for(let i=0;i<3;i++)evs.push({id:'e'+i,t:ts(day,9+i),type:'act.done',aid:'b'+i});
    const d=mkFam(evs);
    const p=[d.acts.get('b0')._pts,d.acts.get('b1')._pts,d.acts.get('b2')._pts];
    ok('T3 DR 100/60/30%: 2ª ≈ 60% de la 1ª (sin bono 1ª-del-día)',p[1]<p[0]&&p[2]<p[1],'pts='+p.join(','));
    // 1ª: 20*(1+.2+.1)=26 ; 2ª: 20*1.2*.6=14.4→14 ; 3ª: 20*1.2*.3=7.2→7
    ok('T3 valores exactos 26/14/7',p[0]===26&&p[1]===14&&p[2]===7,'pts='+p.join(','));
  }
  // T4: improvisada 50%
  {
    const evs=[...base];
    const day=addDays(W0,2);
    evs.push({id:'c1',t:ts(day,8),type:'act.sched',aid:'c1',m:'M1',cat:'salud',title:'agua',tier:'T2',date:day});
    evs.push({id:'c1d',t:ts(day,9),type:'act.done',aid:'c1'});
    const d=mkFam(evs);
    // 20*.5=10 base → 10*(1+.2+.1)=13
    ok('T4 improvisada 50%: 13 pts',d.acts.get('c1')._pts===13,'pts='+d.acts.get('c1')._pts);
  }
  // T5: degradación sin evidencia T4→T3
  {
    const evs=[...base];
    const day=addDays(W0,3);
    evs.push({id:'e1',t:ts(addDays(W0,-2)),type:'act.sched',aid:'e1',m:'M1',cat:'ejercicio',title:'entreno largo',tier:'T4',date:day});
    evs.push({id:'e1d',t:ts(day,9),type:'act.done',aid:'e1',note:'corto'});
    const d=mkFam(evs);
    // T3=35*(1.3)=45.5→46 (streak 0, onTime+first)
    ok('T5 sin evidencia T4 puntúa como T3 (46)',d.acts.get('e1')._pts===46,'pts='+d.acts.get('e1')._pts);
  }
  // T6: tope diario 220 con desbordamiento a XP
  {
    const evs=[...base];

  if(e.key==='Escape'){if(open){const c=open.querySelector('#ps-close');if(c)c.click();else open.remove();return}if(MEET){endMeeting();return}closeModals();return}
  if(open)return;
  if(MEET&&e.key==='ArrowRight')nextAct();
  if(MEET&&e.key==='ArrowLeft'&&MEET.act>0){MEET.act--;renderMeeting()}
});
window.__fzBoot=true;window.addEventListener('error',function(ev){try{var mn=document.getElementById('main');if(mn&&!mn.childElementCount)mn.innerHTML='<div class="card" style="margin:20px;border-color:var(--clay)"><b>Algo falló al cargar</b><p class="small muted">'+String(ev.message).replace(/</g,'&lt;')+'</p></div>'}catch(e){}});
loadState();
if(IS_TEST){runTests()}
else{rerender();initSupa()}
})();
</script>
